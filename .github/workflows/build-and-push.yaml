name: Build and Push Images

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs on every PR and before every image build, so a failing test never ships.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [announcer, collector, evaluator, ingestor, predictor]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21" # matches the golang:1.21 builder in each Dockerfile
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: gofmt
        working-directory: ${{ matrix.service }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...

      - name: go test
        working-directory: ${{ matrix.service }}
        run: go test -race ./...

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [announcer, collector, evaluator, ingestor, predictor]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: gibbonsjohnm
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: gibbonsjohnm/ovechbot-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest
            # Sortable UTC build tag consumed by Flux image automation (numerical ImagePolicy).
            type=raw,value=main-{{date 'YYYYMMDDHHmmss'}}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
